# ========================================
# Docker Compose
# ========================================
#
# COMO USAR:
#   1. docker-compose up -d
#   2. docker-compose logs -f
#   3. docker-compose down
#   4. docker-compose build api
#
# PORTAS:
#   - API: 8080
#   - PostgreSQL: 5434
# ========================================

name: projeto-solr

services:

  # ========================================
  # PostgreSQL - Banco de Dados
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: example-solr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d example-solr"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # ========================================
  # Sorl
  # ========================================
  solr:
    image: solr:10.0
    container_name: test-solr
    ports:
      - "8983:8983"
    volumes:
      - data:/var/solr
    command:
      - solr-precreate
      - produtos
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8983 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - test-network

  # ========================================
  # Spring Boot API
  # ========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projeto-solr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/example-solr
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SOLR_URL: http://solr:8983/solr
    depends_on:
      postgres:
        condition: service_healthy
      solr:
        condition: service_healthy
    networks:
      - test-network

volumes:
  postgres_data:
  data:

networks:
  test-network:
    driver: bridge